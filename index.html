<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050D09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda · Anvil</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Agenda da Anvil · identidade 7.0: preto, verde, floresta, sálvia, branco suave. Tema escuro. */
  :root {
    --preto: #050D09; --s1: #0B1611; --s2: #112019; --s3: #182B22; --floresta: #103C2D; --floresta2: #154A38;
    --verde: #00EC86; --salvia: #86A195; --salvia2: #AFC1B7; --branco: #F4F6F0; --apagado: #4C5E55;
    --alerta: #FF6B5E; --ambar: #FFC46B;
    --t-gravacao: #00EC86; --t-cliente: #7CC4FF; --t-reuniao: #C8B6FF; --t-prospect: #FFD27A; --t-pagar: #FF9F6B; --t-outro: #86A195;
    --sans: Manrope, system-ui, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--preto); color: var(--branco); }
  body { font: 500 16px/1.45 var(--sans); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .t-gravacao { --tc: var(--t-gravacao); } .t-cliente { --tc: var(--t-cliente); } .t-reuniao { --tc: var(--t-reuniao); }
  .t-prospect { --tc: var(--t-prospect); } .t-pagar { --tc: var(--t-pagar); } .t-outro { --tc: var(--t-outro); }

  /* botões */
  .bt { min-height: 44px; padding: 0 18px; border-radius: 12px; background: var(--s2); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background-color .15s; }
  .bt:hover { background: var(--s3); }
  .bt.cheio { background: var(--verde); color: var(--preto); }
  .bt.cheio:hover { background: #45F2A6; }
  .bt.perigo { color: #FF8F84; }
  .bt.alerta { background: var(--alerta); color: var(--preto); }
  .bt.alerta:hover { background: #FF8A80; }
  .bt:disabled { opacity: .5; }

  /* topo */
  .ensaio { background: var(--ambar); color: var(--preto); font-size: 12px; font-weight: 700; text-align: center; padding: 3px 12px; }
  .topo { position: sticky; top: 0; z-index: 5; background: var(--preto); }
  .topo-in { max-width: 1480px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  .marca { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .marca svg { height: 24px; width: auto; color: var(--verde); display: block; flex: none; }
  .marca span { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .abas { display: flex; gap: 2px; }
  .abas button { height: 40px; padding: 0 14px; border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--salvia); display: inline-flex; align-items: center; gap: 7px; transition: color .15s, background-color .15s; }
  .abas button:hover { color: var(--branco); }
  .abas button[aria-selected="true"] { background: var(--s2); color: var(--branco); }
  .abas .n { font: 500 13px var(--mono); color: var(--salvia); }
  .abas .n.al { color: var(--alerta); }
  .eu { width: 40px; height: 40px; border-radius: 50%; background: var(--s2); font-weight: 800; font-size: 15px; flex: none; }
  .eu:hover { background: var(--s3); }

  /* agenda: mês + dia */
  .v-agenda { max-width: 1480px; margin: 0 auto; padding: 4px 20px 24px; }
  .mes-cab { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  .mes-cab h1 { margin: 0 auto 0 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .mes-cab h1 span { color: var(--salvia); font-weight: 600; letter-spacing: -.01em; }
  .nav-bt { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--s1); transition: background-color .15s; }
  .nav-hoje { height: 44px; padding: 0 16px; border-radius: 12px; background: var(--s1); font-weight: 700; font-size: 15px; transition: background-color .15s; }
  .nav-bt:hover, .nav-hoje:hover:not(:disabled) { background: var(--s2); }
  .nav-hoje:disabled { color: var(--apagado); }
  .dsem { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 6px; }
  .dsem span { font-size: 13px; font-weight: 700; color: var(--salvia); padding-left: 10px; }

  .grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cel { position: relative; text-align: left; background: var(--s1); border-radius: 12px; padding: 4px 4px 5px; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; transition: background-color .15s; }
  .cel:hover { background: var(--s2); }
  .cel.fora { background: transparent; }
  .cel.fora:hover { background: var(--s1); }
  .cel.sel, .cel.sel:hover { background: var(--floresta); }
  .cel-topo { display: flex; align-items: center; gap: 5px; height: 24px; flex: none; }
  .num { min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .cel.passado .num { color: var(--salvia); font-weight: 600; }
  .cel.fora .num { color: var(--apagado); font-weight: 600; }
  .cel.hoje .num { background: var(--verde); color: var(--preto); font-weight: 800; }
  .flag { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; line-height: 1; color: var(--preto); flex: none; }
  .flag.bate { background: var(--alerta); }
  .flag.cheio { background: var(--ambar); }
  .mais-n { margin-left: auto; font: 500 12px var(--mono); color: var(--salvia2); padding-right: 3px; }
  .evs { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .chip[hidden] { display: none; }
  .chip { display: flex; align-items: baseline; gap: 5px; height: 18px; line-height: 18px; padding: 0 6px; border-radius: 6px; background: rgba(134, 161, 149, .14); background: color-mix(in srgb, var(--tc) 15%, transparent); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
  .chip i { font: 500 12px var(--mono); font-style: normal; color: var(--tc); flex: none; }
  .chip span { overflow: hidden; text-overflow: ellipsis; }
  .chip.feito { opacity: .45; }
  .chip.bate i { color: var(--alerta); }
  .cel.passado .evs, .cel.fora .evs { opacity: .6; }
  .pontos { display: none; }

  /* painel do dia */
  .painel { background: var(--s1); border-radius: 20px; padding: 20px; min-width: 0; }
  .dia-cab { margin-bottom: 16px; }
  .dia-cab .ds { margin: 0 0 2px; font-size: 14px; font-weight: 700; color: var(--salvia); }
  .dia-cab .ds b { color: var(--verde); font-weight: 800; }
  .dia-cab h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; }
  .dia-res { margin: 6px 0 0; font-size: 15px; color: var(--salvia2); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .dia-res .m { font-family: var(--mono); font-size: 14px; color: var(--branco); }
  .tag { font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .tag.bate { color: var(--alerta); background: rgba(255, 107, 94, .13); }
  .tag.cheio { color: var(--ambar); background: rgba(255, 196, 107, .12); }

  .m-campo { display: flex; align-items: center; gap: 10px; background: var(--s2); border-radius: 14px; padding: 6px 6px 6px 10px; min-height: 56px; transition: box-shadow .15s; }
  .m-campo:focus-within { box-shadow: 0 0 0 2px rgba(0, 236, 134, .6); }
  .m-mais { width: 30px; height: 30px; border-radius: 9px; background: var(--verde); color: var(--preto); display: grid; place-items: center; flex: none; }
  .m-campo input { flex: 1; min-width: 0; height: 44px; background: none; border: 0; outline: none; font-size: 16px; font-weight: 600; }
  .m-campo input::placeholder { color: var(--salvia); font-weight: 500; opacity: 1; }
  .m-ok { height: 44px; padding: 0 16px; border-radius: 10px; background: var(--verde); color: var(--preto); font-weight: 800; font-size: 15px; flex: none; }
  .m-previa { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 2px 0 4px; font-size: 15px; color: var(--salvia2); }
  .pv { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .pv .m { font-family: var(--mono); font-size: 14px; color: var(--branco); }
  .pv-cor { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: none; }
  .pv .dica { color: var(--salvia); font-size: 14px; }
  .m-det { color: var(--salvia2); font-size: 14px; font-weight: 700; text-decoration: underline; text-decoration-color: rgba(175, 193, 183, .45); text-underline-offset: 4px; min-height: 36px; padding: 0 4px; flex: none; }
  .m-det:hover { color: var(--branco); }
  .aviso-bate { margin-top: 8px; background: var(--s2); border-radius: 14px; padding: 14px 16px 16px; display: grid; gap: 4px; }
  .aviso-bate b { color: var(--alerta); font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .aviso-bate b::before { content: "!"; width: 18px; height: 18px; border-radius: 50%; background: var(--alerta); color: var(--preto); font-size: 12px; display: grid; place-items: center; }
  .aviso-bate p { margin: 0; font-size: 15px; }
  .aviso-bate p .m { font-family: var(--mono); font-size: 14px; }
  .aviso-bate .bt { justify-self: start; margin-top: 8px; }
  .aviso-cheio { margin: 8px 0 0 4px; color: var(--ambar); font-size: 14px; font-weight: 600; }
  .erro { color: #FF8F84; font-size: 15px; margin: 8px 0 0 4px; }
  .erro:empty { display: none; }

  /* voz: microfone, ouvindo, entendendo */
  .m-voz { height: 44px; min-width: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--s3); color: var(--verde); flex: none; transition: background-color .15s, color .15s; }
  .m-voz:hover { background: var(--floresta2); }
  .m-voz .rot { display: none; }
  .m-voz svg { flex: none; }
  .m-campo.ouvindo { box-shadow: 0 0 0 2px var(--verde); }
  .m-campo.ouvindo .m-voz, .m-campo.ouvindo .m-voz:hover { background: var(--verde); color: var(--preto); }
  .m-campo.entendendo .m-voz { opacity: .45; }
  .voz-st { display: inline-flex; align-items: center; gap: 9px; color: var(--branco); font-weight: 600; }
  .voz-ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--verde); flex: none; animation: pulso 1.1s ease-in-out infinite; }
  .voz-st.lendo .voz-ponto { background: var(--salvia2); animation-duration: .7s; }
  @keyframes pulso { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.65); } }
  .m-vivo { margin: 2px 4px 4px; font-size: 18px; font-weight: 600; line-height: 1.45; color: var(--branco); overflow-wrap: anywhere; }
  .m-vivo i { font-style: normal; color: var(--salvia2); }
  .m-vivo.lendo { color: var(--salvia2); }
  .voz-msg { margin-top: 8px; background: var(--s2); border-radius: 14px; padding: 13px 16px 14px; display: grid; gap: 3px; }
  .voz-msg b { font-size: 15px; font-weight: 800; color: var(--ambar); }
  .voz-msg.al b { color: #FF8F84; }
  .voz-msg p { margin: 0; font-size: 15px; color: var(--salvia2); }
  #m-vozmsg:empty { display: none; }

  /* voz: confirmação antes de gravar */
  .conf { margin-top: 12px; background: var(--s2); border-radius: 18px; padding: 16px 10px 14px; display: grid; --anel: var(--s2); scroll-margin: 12px 0 12px; }
  .conf-cab { padding: 0 8px 4px; }
  .conf-cab h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
  .conf-cab h3:focus { outline: none; }
  .conf-fala { margin: 4px 0 0; font-size: 14px; color: var(--salvia); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cf-dia { margin: 12px 0 2px 8px; font-size: 14px; font-weight: 700; color: var(--salvia2); }
  .cf-dia b { color: var(--verde); font-weight: 800; }
  .conf-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .cf { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-radius: 14px; transition: background-color .15s; }
  .cf:hover { background: var(--s3); }
  .cf .it-linha { grid-template-columns: 46px 4px minmax(0, 1fr); gap: 10px; padding: 12px 0 12px 8px; }
  .cf-tirar { width: 44px; height: 44px; margin: 8px 0 0; border-radius: 12px; display: grid; place-items: center; color: var(--salvia2); }
  .cf-tirar:hover { background: var(--s2); color: var(--branco); }
  .cf-duvida { justify-self: start; margin-top: 5px; display: inline-flex; align-items: flex-start; gap: 7px; font-size: 14px; font-weight: 700; line-height: 1.35; color: var(--ambar); background: rgba(255, 196, 107, .12); border-radius: 9px; padding: 4px 10px 4px 6px; }
  .cf-duvida::before { content: "?"; width: 17px; height: 17px; margin-top: 1px; border-radius: 50%; background: var(--ambar); color: var(--preto); font-size: 11px; font-weight: 800; display: grid; place-items: center; flex: none; }
  .cf.bate .it-hora b { color: var(--alerta); }
  .cf .it-bate { margin-top: 3px; }
  .cf-forca { grid-column: 1 / -1; padding: 0 12px 12px 68px; }
  .conf-acoes { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 14px; padding: 0 2px; }
  .conf-acoes .bt { min-height: 48px; padding: 0 20px; }
  .conf-nota { font-size: 14px; font-weight: 700; color: var(--alerta); }

  /* itens do dia (e das contas) */
  .itens { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 2px; }
  .itens:empty { display: none; }
  .item { border-radius: 14px; transition: background-color .15s; --anel: var(--s1); }
  .item:hover, .item.aberto { background: var(--s2); --anel: var(--s2); }
  .it-linha { width: 100%; text-align: left; display: grid; grid-template-columns: 50px 4px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 12px 12px 10px; min-height: 60px; border-radius: 14px; }
  .it-hora { display: grid; font-family: var(--mono); line-height: 1.35; padding-top: 1px; }
  .it-hora b { font-weight: 500; font-size: 15px; }
  .it-hora i { font-style: normal; font-size: 13px; color: var(--salvia); }
  .it-hora .sh { font: 700 13px var(--sans); color: var(--salvia); }
  .it-hora .venc { color: var(--alerta); }
  .it-cor { align-self: stretch; border-radius: 2px; background: var(--tc); min-height: 22px; }
  .it-txt { display: grid; gap: 2px; min-width: 0; }
  .it-tit { font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
  .it-sub { font-size: 14px; color: var(--salvia); overflow-wrap: anywhere; }
  .it-bate { font-size: 14px; font-weight: 700; color: var(--alerta); overflow-wrap: anywhere; }
  .it-valor { font: 500 15px var(--mono); white-space: nowrap; padding-top: 1px; }
  .item.feito .it-tit { text-decoration: line-through; text-decoration-color: var(--salvia); color: var(--salvia2); }
  .item.feito .it-cor { opacity: .4; }
  .item.oculto .it-tit { color: var(--salvia2); font-weight: 600; }
  .quem { display: flex; padding-left: 6px; padding-top: 1px; }
  .quem b { width: 26px; height: 26px; border-radius: 50%; background: var(--c, var(--salvia)); color: var(--preto); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-left: -6px; box-shadow: 0 0 0 2px var(--anel); }
  .it-mais { padding: 0 12px 14px 76px; display: grid; gap: 12px; }
  .it-det { margin: 0; font-size: 14px; color: var(--salvia2); display: grid; gap: 2px; }
  .it-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .item.novo { animation: brilho 1.6s ease-out; }
  @keyframes brilho { from { background: var(--floresta2); } to { background: transparent; } }

  /* contas e prospects */
  .lista-v { max-width: 760px; margin: 0 auto; padding: 8px 20px 60px; }
  .lista-cab { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 6px; }
  .lista-cab h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .lista-cab p { margin: 6px 0 0; font-size: 15px; color: var(--salvia2); }
  .lista-cab p .al { color: var(--alerta); font-weight: 700; }
  .lista-cab .bt { margin-left: auto; flex: none; }
  .grupo { margin: 26px 0 0 12px; font-size: 14px; font-weight: 700; color: var(--salvia); }
  .lista-v .itens { margin-top: 6px; }
  .lista-v .item { --anel: var(--preto); }
  .lista-v .item:hover, .lista-v .item.aberto { background: var(--s1); }
  .it-linha.pr { grid-template-columns: minmax(0, 1fr) auto; padding-left: 14px; }
  .it-data { font: 500 14px var(--mono); color: var(--salvia2); white-space: nowrap; padding-top: 2px; }
  .it-data.venc { color: var(--alerta); }
  .vazio { color: var(--salvia2); padding: 28px 12px; font-size: 16px; }

  /* ficha */
  dialog { border: 0; background: var(--s1); color: var(--branco); border-radius: 22px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); }
  dialog::backdrop { background: rgba(2, 6, 4, .74); }
  .ficha { padding: 22px 22px 24px; display: grid; gap: 18px; }
  .f-cab { display: flex; align-items: center; margin-bottom: -4px; }
  .f-cab h2 { margin: 0 auto 0 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .f-cab h2:focus { outline: none; }
  .x { width: 44px; height: 44px; margin-right: -10px; border-radius: 12px; display: grid; place-items: center; color: var(--salvia2); }
  .x:hover { background: var(--s2); color: var(--branco); }
  .campo { display: grid; gap: 8px; min-width: 0; border: 0; margin: 0; padding: 0; }
  .campo > span, .campo > legend { font-size: 14px; font-weight: 700; color: var(--salvia2); padding: 0; }
  fieldset.campo > legend { margin-bottom: 8px; }
  .ficha input[type=text], .ficha input[type=date], .ficha input[type=time], .ficha input[type=number], .ficha textarea {
    width: 100%; min-width: 0; height: 48px; background: var(--s2); border: 0; border-radius: 12px; padding: 0 14px; font-size: 16px; color-scheme: dark; transition: box-shadow .15s; }
  .ficha textarea { height: auto; min-height: 76px; padding: 12px 14px; resize: vertical; line-height: 1.4; }
  .ficha input:focus, .ficha textarea:focus { outline: none; box-shadow: 0 0 0 2px var(--verde); }
  .ficha ::placeholder { color: var(--salvia); opacity: 1; }
  #f-titulo { height: 52px; font-size: 18px; font-weight: 700; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcoes label { position: relative; }
  .opcoes input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opcoes span { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 15px; border-radius: 999px; background: var(--s2); font-weight: 700; font-size: 15px; color: var(--salvia2); transition: background-color .15s, color .15s; }
  .opcoes span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--salvia)); }
  .opcoes input:checked + span { background: var(--branco); color: var(--preto); }
  .opcoes input:focus-visible + span { outline: 2px solid var(--verde); outline-offset: 2px; }
  .linha3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #f-aviso:empty { display: none; }
  #f-aviso { display: grid; gap: 8px; }
  #f-aviso .aviso-bate, #f-aviso .aviso-cheio { margin: 0; }
  #f-aviso .aviso-bate { background: var(--s2); }

      while ((m = faixa.exec(n))) {
        const g = m.groups, i = m.index, f = i + m[0].length;
        const marca1 = g.m1 != null || !!g.s1, marca2 = g.m2 != null || !!g.s2;
        const vale = g.pre || g.per || (g.sep === "-" || g.sep === "–" ? marca1 || marca2 : marca1 || (/^as|^ate/.test(g.sep) && marca2) || (g.sep === "as" && !marca1));
        let h1 = ajusta(+g.h1, g.h1.length === 2 && g.h1[0] === "0", g.per), h2 = ajusta(+g.h2, g.h2.length === 2 && g.h2[0] === "0", g.per);
        const m1 = +(g.m1 || 0), m2 = +(g.m2 || 0);
        if (h2 * 60 + m2 <= h1 * 60 + m1 && +g.h2 < 12) h2 = +g.h2 + 12;
        if (vale && livre(i, f) && ok(h1, m1) && ok(h2, m2) && h2 * 60 + m2 > h1 * 60 + m1) {
          r.hora_ini = hm(h1, m1); r.hora_fim = hm(h2, m2); cortes.push([i, f]); break;
        }
        faixa.lastIndex = i + 1;
      }
      if (!r.hora_ini) {
        const uma = new RegExp(String.raw`(?<pre>\b(?:a partir das?|as|das?)\s+)?(?<![\d:/.,])` + HH(1) + PER + String.raw`(?![\d:/]|[.,]\d)`, "g");
        while ((m = uma.exec(n))) {
          const g = m.groups, i = m.index, f = i + m[0].length;
          const h = ajusta(+g.h1, g.h1.length === 2 && g.h1[0] === "0", g.per), mm = +(g.m1 || 0);
          if ((g.pre || g.m1 != null || g.s1 || g.per) && livre(i, f) && ok(h, mm)) { r.hora_ini = hm(h, mm); cortes.push([i, f]); break; }
          uma.lastIndex = i + 1;
        }
      }
      if (!r.hora_ini) {
        const md = /(?:\b(?:ao|as|a)\s+)?\bmeio[\s-]dia\b/.exec(n);
        if (md && livre(md.index, md.index + md[0].length)) { r.hora_ini = "12:00"; cortes.push([md.index, md.index + md[0].length]); }
      }
    }

    // 4. quem vai: "com o Felipe" = eu + Felipe; "felipe e nath" sozinho = só eles; ninguém citado = eu
    if (r.tipo !== "pagar") {
      const alias = [];
      for (const p of pessoas) { const a = sem(String(p.nome || p.id)); for (const x of new Set([a, sem(String(p.id)), a.replace(/h$/, "")])) if (x.length >= 2) alias.push([x, p.id]); }
      if (eu) alias.push(["eu", eu], ["mim", eu], ["comigo", eu]);
      const citados = []; let com = false;
      if (alias.length) {
        const NOMES = alias.map(([a]) => a).sort((x, y) => y.length - x.length).map(reEsc).join("|");
        const UM = `(?:\\b(?:o|a)\\s+)?\\b(?:${NOMES})\\b`;
        const grupo = new RegExp(`(?<com>\\bcom\\s+)?${UM}(?:\\s*(?:,|\\be\\b)\\s*${UM})*`, "g");
        let m;
        while ((m = grupo.exec(n))) {
          const i = m.index, f = i + m[0].length;
          if (!livre(i, f)) { grupo.lastIndex = i + 1; continue; }
          cortes.push([i, f]);
          if (m.groups.com || /\bcomigo\b/.test(m[0])) com = true;
          for (const x of m[0].match(new RegExp(`\\b(?:${NOMES})\\b`, "g")) || []) { const id = (alias.find(([a]) => a === x) || [])[1]; if (id && !citados.includes(id)) citados.push(id); }
        }
      }
      const q = [];
      if (eu && (com || citados.includes(eu) || !citados.length)) q.push(eu);
      for (const id of citados) if (!q.includes(id)) q.push(id);
      r.quem = pessoas.length ? q.filter((id) => pessoas.some((p) => p.id === id)) : q;
    }

    // 5. título: o que sobrou, sem pontas soltas
    let t = orig;
    for (const [i, f] of [...cortes].sort((a, b) => b[0] - a[0])) t = t.slice(0, i) + " " + t.slice(f);
    t = t.replace(/\s+/g, " ").replace(/\s+([,.;:!?])/g, "$1").trim();
    const PONTA = "(?:[,.;:·+\\-–]+|e|com|as|às|das|de|do|da|no|na|em|o|a|pra|para|ao|até|ate|dia)";
    const sobra = new RegExp(`^${PONTA}(?:\\s+|$)|(?:^|\\s+)${PONTA}$`);
    for (let k = 0; k < 8; k++) { const u = t.replace(sobra, "").trim(); if (u === t) break; t = u; }
    // cliente conhecido volta com a grafia certa
    for (const c of clientes) {
      const m = new RegExp(`(?<![a-z0-9])${reEsc(sem(c))}(?![a-z0-9])`).exec(sem(t));
      if (m) { t = t.slice(0, m.index) + c + t.slice(m.index + c.length); if (!r.cliente) r.cliente = c; }
    }
    // a palavra logo depois de "gravação", "visita", "call"... costuma ser o cliente: ganha maiúscula
    if (kw && r.tipo !== "pagar") {
      const nt = sem(t), k = PAL[r.tipo].exec(nt);
      if (k) {
        const resto = nt.slice(k.index + k[0].length);
        const w = /^\s+((?:(?:no|na|ao|com|cliente)\s+)*)([a-z][a-z0-9&]*)/.exec(resto);
        const PARADA = new Set(["sobre", "para", "pra", "de", "do", "da", "dos", "das", "e", "o", "a", "os", "as", "um", "uma", "em", "hoje", "amanha", "tarde", "manha", "noite", "dia", "geral", "interna", "rapida"]);
        if (w && w[2].length >= 3 && !PARADA.has(w[2])) {
          const pos = k.index + k[0].length + w[0].length - w[2].length;
          if (/[a-zà-ÿ]/.test(t[pos])) t = t.slice(0, pos) + t[pos].toUpperCase() + t.slice(pos + 1);
        }
      }
    }
    if (!t) t = NOMES_TIPO[r.tipo];
    r.titulo = (t.charAt(0).toUpperCase() + t.slice(1)).slice(0, 140);
    return r;
  }
  // ── interpretador:fim ──

  const st = { chave: null, eu: null, pessoas: [], hoje: iso(new Date()), mes: null, sel: null, eventos: [], contas: [], prospects: [], aba: "agenda", aberto: null, novo: null, conf: null };
  const guarda = { ler: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, por: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

  async function rpc(fn, args) {
    const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: CFG.anon, Authorization: `Bearer ${CFG.anon}` },
      body: JSON.stringify({ p_chave: st.chave, ...args }),
    });
    const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = t; }
    if (!r.ok) throw new Error((j && j.message) || `erro ${r.status}`);
    return j;
  }
  const traduz = (m) => ({
    "chave invalida": "Esse link não vale mais. Peça um novo ao Augusto.",
    "sem permissao": "Você não pode mexer nesse compromisso.",
    "sem permissao para esse tipo": "Esse tipo é só para os sócios.",
    "falta o titulo": "Escreva o que é o compromisso.",
    "falta o dia": "Escolha o dia.",

    "Failed to fetch": "Sem conexão. Tente de novo.",
  }[m] || m);

  let toastT;
  function toast(msg, acao, fn) {

    const s = document.createElement("span"); s.textContent = msg; e.append(s);
    if (acao) { const b = document.createElement("button"); b.textContent = acao; b.onclick = () => { e.remove(); fn(); }; e.append(b); }
    document.body.append(e);
    clearTimeout(toastT); toastT = setTimeout(() => e.remove(), acao ? 6000 : 2600);
  }

  // ───────── entrada ─────────
  function porta(msg) {
    $("#app").className = "";
    $("#app").innerHTML = `<div class="porta"><div>${SIMBOLO}
      <h1>Agenda da Anvil</h1>

    $("#p-ok").onclick = () => { const v = $("#p-chave").value.trim(); const k = (v.match(/k=([^&\s]+)/) || [])[1] || v; if (k) { st.chave = k; entrar(); } };
    $("#p-chave").onkeydown = (e) => { if (e.key === "Enter") $("#p-ok").click(); };
  }
  async function entrar() {
    if (!CFG.url) return porta("A agenda ainda não está ligada na internet. Por enquanto ela abre só no computador do Augusto.");
    try {
      const r = await rpc("agenda_entrar", {});
      st.eu = r.eu; st.pessoas = r.pessoas; st.hoje = r.hoje || st.hoje; st.mes = primeiro(st.hoje); st.sel = st.hoje;
      guarda.por("agenda.chave", st.chave);
      casca(); desenha(); await carregar();
    } catch (e) {
      if (/chave/.test(e.message)) { guarda.por("agenda.chave", null); porta(traduz("chave invalida")); }
      else porta(traduz(e.message));
    }
  }

  // ───────── dados ─────────
  const socio = () => st.eu && st.eu.papel !== "equipe";
  let cargaSeq = 0, emVoo = false;
  async function carregar(silencioso) {
    if (silencioso && emVoo) return;
    const meu = ++cargaSeq; emVoo = true;
    try {
      const pedidos = [rpc("agenda_listar", { p_de: segunda(st.mes), p_ate: fimGrade(st.mes) })];
      if (socio()) pedidos.push(rpc("agenda_contas", {}), rpc("agenda_prospects", {}));
      const [ev, contas, prospects] = await Promise.all(pedidos);
      if (meu !== cargaSeq) return;
      st.eventos = ev; if (contas) st.contas = contas; if (prospects) st.prospects = prospects;
      desenha();
    } catch (e) { if (!silencioso && meu === cargaSeq) toast(traduz(e.message)); }
    finally { if (meu === cargaSeq) emVoo = false; }
  }

  // quem bate com quem, só para pintar (a regra que vale é a do banco)
  function batidas(evs) {
    const s = new Map();
    const lista = evs.filter((e) => e.status === "marcado" && e.tipo !== "pagar" && e.hora_ini);
    for (let i = 0; i < lista.length; i++) for (let j = i + 1; j < lista.length; j++) {
      const a = lista[i], b = lista[j];
      if (a.dia !== b.dia || !a.quem.some((q) => b.quem.includes(q))) continue;
      const af = min(a.hora_fim) ?? min(a.hora_ini) + 60, bf = min(b.hora_fim) ?? min(b.hora_ini) + 60;
      if (min(a.hora_ini) < bf && min(b.hora_ini) < af) { s.set(a.id, [...(s.get(a.id) || []), b]); s.set(b.id, [...(s.get(b.id) || []), a]); }
    }
    return s;
  }
  const pessoa = (id) => st.pessoas.find((p) => p.id === id) || { id, nome: id, cor: "#86A195" };
  const nomes = (quem) => quem.map((q) => pessoa(q).nome).join(", ");
  const bolinhas = (quem) => quem.length ? `<span class="quem" aria-label="${esc(nomes(quem))}">${quem.map((q) => { const p = pessoa(q); return `<b style="--c:${esc(p.cor || "#86A195")}" title="${esc(p.nome)}">${esc(p.nome[0])}</b>`; }).join("")}</span>` : "";
  const ordem = (a, b) => (a.tipo === "pagar") - (b.tipo === "pagar") || (a.hora_ini || "").localeCompare(b.hora_ini || "") || a.titulo.localeCompare(b.titulo);
  const doDia = (d) => st.eventos.filter((e) => e.dia === d).sort(ordem);
  const acharEv = (id) => st.eventos.find((e) => e.id === id) || st.contas.find((e) => e.id === id);
  function carga(evs) {
    const comp = evs.filter((e) => e.tipo !== "pagar" && e.status === "marcado");
    const porPessoa = Math.max(0, ...st.pessoas.map((p) => comp.filter((e) => e.quem.includes(p.id)).length));
    return { comp, cheio: porPessoa >= 3 || comp.length >= 4 };
  }
  const clientesConhecidos = () => [...new Set([...st.eventos, ...st.contas].map((e) => e.cliente).concat(st.prospects.map((p) => p.nome)).filter(Boolean))];

  // ───────── casca ─────────
  function casca() {
    $("#app").className = "app";
    $("#app").innerHTML = `
      ${CFG.ensaio ? '<div class="ensaio">ENSAIO · dados de teste, nada aqui é a agenda de verdade</div>' : ""}
      <header class="topo"><div class="topo-in">
        <div class="marca">${SIMBOLO}<span>Agenda</span></div>
        <div class="abas" role="tablist" id="abas" aria-label="Seções"></div>
        <button class="eu" id="eu" title="${esc(st.eu.nome)}" aria-label="Você entrou como ${esc(st.eu.nome)}">${esc(st.eu.nome[0])}</button>
      </div></header>
      <div class="instalar" id="instalar" hidden></div>
      <main class="vistas">
        <div class="v-agenda" id="v-agenda">
          <section class="col-mes" aria-label="Mês">
            <div class="mes-cab">
              <h1 id="mes-tit" aria-live="polite"></h1>

            <div class="grade" id="grade" role="group" aria-label="Dias do mês"></div>
          </section>
          <section class="painel" id="painel" aria-label="Dia escolhido">

                ${SR ? `<button class="m-voz" id="m-voz" type="button" aria-pressed="false" aria-label="Falar para marcar" title="Falar para marcar">${MIC}<span class="rot">Falar</span></button>` : ""}
                <button class="m-ok" id="m-ok" type="submit" hidden>Marcar</button>

        <section class="lista-v" id="v-contas" hidden></section>
        <section class="lista-v" id="v-prospects" hidden></section>
      </main>`;
    $("#eu").onclick = () => { if (confirm(`Você entrou como ${st.eu.nome}. Sair deste aparelho?`)) { guarda.por("agenda.chave", null); location.reload(); } };
    $("#abas").onclick = (e) => { const b = e.target.closest("[data-aba]"); if (b) { st.aba = b.dataset.aba; st.aberto = null; desenha(); } };
    $("#n-ant").onclick = () => irMes(-1);

    $("#grade").addEventListener("dblclick", (e) => { if (e.target.closest(".cel")) $("#m-txt").focus(); });
    $("#grade").addEventListener("keydown", (e) => {
      const passo = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
      if (passo) { e.preventDefault(); selecionar(soma(st.sel, passo), true); }

  // no celular, fora do aplicativo: ensina a pôr na tela inicial (uma vez só)
  let pedidoInstalar = null;

  function dicaInstalar() {

  function desenha() {

  }

  function desenhaAbas() {
    const venc = st.contas.filter((c) => c.dia < st.hoje).length;
    const pAbertos = st.prospects.filter((p) => !["fechado", "perdido"].includes(p.etapa)).length;
    const abas = [["agenda", "Agenda", ""], ...(socio() ? [["contas", "Contas", st.contas.length || ""], ["prospects", "Prospects", pAbertos || ""]] : [])];
    $("#abas").innerHTML = abas.map(([id, nome, n]) => {

      return `<button role="tab" data-aba="${id}" aria-selected="${st.aba === id}" aria-label="${rot}">${nome}${n !== "" ? `<span class="n ${al ? "al" : ""}">${n}</span>` : ""}</button>`;
    }).join("");

  }

  // ───────── mês ─────────
  function irMes(n) {
    const d = dt(st.mes); d.setMonth(d.getMonth() + n);
    st.mes = iso(d); st.sel = primeiro(st.hoje) === st.mes ? st.hoje : st.mes; st.aberto = null;
    desenhaMes(); desenhaDia(); mAtualiza(); carregar();
  }
  function selecionar(d, foco) {
    const mudouMes = primeiro(d) !== st.mes;
    if (d !== st.sel) st.aberto = null;
    st.sel = d; if (mudouMes) st.mes = primeiro(d);
    if (st.aba !== "agenda") { st.aba = "agenda"; desenha(); } else { desenhaMes(); desenhaDia(); }
    mAtualiza();
    if (foco) { const c = $(`.cel[data-dia="${d}"]`); if (c) c.focus(); }
    if (mudouMes) carregar();
  }
  function desenhaMes() {
    const m = dt(st.mes);
    $("#mes-tit").innerHTML = `${MES_LONGO[m.getMonth()].replace(/^./, (c) => c.toUpperCase())} <span>${m.getFullYear()}</span>`;
    $("#n-hoje").disabled = st.sel === st.hoje;
    const ini = segunda(st.mes), fim = fimGrade(st.mes), bate = batidas(st.eventos);
    const focado = document.activeElement && document.activeElement.closest && document.activeElement.closest(".cel") ? document.activeElement.dataset.dia : null;
    let h = "", n = 0;
    for (let d = ini; d <= fim; d = soma(d, 1), n++) {
      const D = dt(d), evs = doDia(d), { comp, cheio } = carga(evs);
      const temBate = comp.some((e) => bate.has(e.id));
      const cl = ["cel", d === st.hoje && "hoje", d === st.sel && "sel", d < st.hoje && "passado", primeiro(d) !== st.mes && "fora"].filter(Boolean).join(" ");
      const rot = `${DSEM_LONGO[D.getDay()]}, ${D.getDate()} de ${MES_LONGO[D.getMonth()]}${d === st.hoje ? ", hoje" : ""}${evs.length ? `, ${plural(evs.length, "compromisso", "compromissos")}` : ""}${temBate ? ", horário batendo" : cheio ? ", dia cheio" : ""}`;
      const chips = evs.slice(0, 3).map((e) => `<span class="chip t-${e.tipo}${e.status === "feito" ? " feito" : ""}${bate.has(e.id) ? " bate" : ""}" title="${esc(e.titulo)}"><i>${e.tipo === "pagar" ? "R$" : e.hora_ini ? hc(e.hora_ini) : "·"}</i><span>${esc(curto(e.titulo))}</span></span>`).join("");
      const flag = temBate ? '<span class="flag bate" aria-hidden="true">!</span>' : cheio ? '<span class="flag cheio" aria-hidden="true">!</span>' : "";

  // na tela larga, cada dia mostra só os compromissos que cabem inteiros; o resto vira "+N"

  // ───────── dia ─────────
  function desenhaDia() {

  // ───────── voz: ditar, ler com o Claude (local/voz.mjs) e confirmar antes de gravar ─────────
  // Frase digitada com dia ("quarta", "amanhã", "dia 20") ou com cara de vários compromissos vai para a mesma leitura.
  const semAcento = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const DIA_NA_FRASE = /(?<![a-z0-9])(hoje|amanha|depois de amanha|segunda|terca|quarta|quinta|sexta|sabado|domingo|semana que vem|proxima semana|mes que vem)(?![a-z0-9])|(?<![a-z0-9])dia\s+\d{1,2}(?![\d:h])|(?<![\d/])\d{1,2}\/\d{1,2}(?![\d/])|(?<![a-z0-9])\d{1,2}\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?![a-z])/;

  const voz = { estado: null, rec: null, base: "", final: "", parcial: "", erro: null, cancelado: false, seq: 0, falhou: null, lendo: "" };
  function vozBotao() {
    if (voz.estado === "ouvindo") return vozPara();

  }
  function vozOuve() {
    vozMsg(""); confFecha(true);
    Object.assign(voz, { erro: null, cancelado: false, final: "", parcial: "", base: $("#m-txt").value.trim() });

  async function vozInterpretar(fala) {

  function vozDesenha() {

  function vozVivo() {
    const vivo = $("#m-vivo");

      vivo.className = "m-vivo lendo"; vivo.hidden = false; vivo.textContent = voz.lendo;
    } else { vivo.hidden = true; vivo.textContent = ""; }
  }
  const vozMsg = (h) => { const el = $("#m-vozmsg"); if (el) el.innerHTML = h; };
  const vMsg = (cl, tit, txt) => `<div class="voz-msg ${cl}" role="${cl === "al" ? "alert" : "status"}"><b>${tit}</b><p>${txt}</p></div>`;
  const MSG_NADA_OUVIDO = vMsg("", "Não ouvi nada.", "Toque no microfone e fale perto dele. Pode falar vários compromissos de uma vez.");
  const MSG_SEM_COMPROMISSO = vMsg("", "Não achei compromisso nessa fala.", "Diga o que é, o dia e a hora, por exemplo: “quarta dentista às 4”. O texto ficou no campo, se quiser ajustar.");

  function msgMic(c) {

  // ── confirmação: lista do que foi entendido; só grava no "Marcar" ──
  let confK = 0, confSeq = 0;
  function confLimpa(l) {
    const hm = (h) => (typeof h === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(h) ? h : "");
    return (Array.isArray(l) ? l : []).slice(0, 12).filter((c) => c && typeof c.titulo === "string" && c.titulo.trim() && /^\d{4}-\d{2}-\d{2}$/.test(c.dia || "") && TIPO_NOME[c.tipo]).map((c) => {
      let tipo = c.tipo; if (!socio() && tipo === "pagar") tipo = "outro"; if (!socio() && tipo === "prospect") tipo = "reuniao";
      const ini = hm(c.hora_ini), fim = hm(c.hora_fim), conta = tipo === "pagar";
      return { k: `v${++confK}`, titulo: c.titulo.trim().slice(0, 140), tipo, dia: c.dia, hora_ini: conta ? "" : ini, hora_fim: conta || !ini || fim <= ini ? "" : fim,
        quem: conta ? [] : (Array.isArray(c.quem) ? c.quem : []).filter((q, i, a) => st.pessoas.some((p) => p.id === q) && a.indexOf(q) === i),
        cliente: String(c.cliente || "").slice(0, 80), local: String(c.local || "").slice(0, 120), valor: conta && Number.isFinite(Number(c.valor)) && c.valor !== null && c.valor !== "" ? Number(c.valor) : null,
        duvida: String(c.duvida || "").slice(0, 160), conflitos: [], naLista: [], erro: "" };
    });
  }
  const confEv = (it) => ({ titulo: it.titulo, tipo: it.tipo, dia: it.dia, hora_ini: it.hora_ini, hora_fim: it.hora_fim, quem: it.tipo === "pagar" ? [] : it.quem, cliente: it.cliente, local: it.tipo === "pagar" ? "" : it.local, obs: "", valor: it.tipo === "pagar" && it.valor != null ? String(it.valor) : "" });
  const confBate = (it) => it.conflitos.length > 0 || it.naLista.length > 0;
  const entre = (a, b) => {
    if (a.dia !== b.dia || a.tipo === "pagar" || b.tipo === "pagar" || !a.hora_ini || !b.hora_ini || !a.quem.some((q) => b.quem.includes(q))) return false;
    const af = min(a.hora_fim) ?? min(a.hora_ini) + 60, bf = min(b.hora_fim) ?? min(b.hora_ini) + 60;
    return min(a.hora_ini) < bf && min(b.hora_ini) < af;
  };
  function confAbre(fala, itens) {

  function confFecha(quieto) {

  // horário batendo: com o que já está na agenda (banco) e entre os próprios itens da lista
  async function confConferir() {

    if (meu !== confSeq || c !== st.conf) return;
    c.itens.forEach((it, i) => { it.conflitos = res[i].conflitos || []; });
    for (const a of c.itens) a.naLista = c.itens.filter((b) => b !== a && entre(a, b));

  }
  // a lista inteira à vista (se couber; senão, do começo)
  function confMostra() {
    const el = $("#m-conf"); if (el.hidden) return;

  }
  const diaLongo = (d) => {

  function desenhaConf() {

  // depois de gravar: a grade vai para o mês (e o dia) do primeiro item gravado

  // ───────── contas e prospects ─────────

      F("#f-cancelar").onclick = () => agir("desmarcar", e, F("#f-cancelar"));
    }
    modo(); dlg.showModal(); if (novo && !e.titulo) F("#f-titulo").focus(); else F("#f-cab").focus(); conferir();
  }

  // ───────── ficha do prospect ─────────
  function fichaProspect(pr) {
    const p = { nome: "", contato: "", etapa: "contato", proximo_passo: "", proximo_dia: "", obs: "", ...(pr || {}) };
    dlg.innerHTML = `<form class="ficha" id="ficha" novalidate>
      <div class="f-cab"><h2>${p.id ? "Prospect" : "Novo prospect"}</h2><button type="button" class="x" id="f-x" aria-label="Fechar">${FECHAR}</button></div>
      <div class="linha2">
        <label class="campo"><span>Empresa</span><input id="p-nome" type="text" maxlength="120" autocomplete="off" value="${esc(p.nome)}"></label>
        <label class="campo"><span>Pessoa</span><input id="p-contato" type="text" maxlength="80" autocomplete="off" value="${esc(p.contato || "")}"></label>
      </div>
      <fieldset class="campo"><legend>Etapa</legend><div class="opcoes">${ETAPAS.map(([id, nome]) => `<label><input type="radio" name="etapa" value="${id}" ${p.etapa === id ? "checked" : ""}><span>${nome}</span></label>`).join("")}</div></fieldset>
      <div class="linha2">
        <label class="campo"><span>Próximo passo</span><input id="p-passo" type="text" maxlength="160" autocomplete="off" value="${esc(p.proximo_passo || "")}"></label>
        <label class="campo"><span>Até quando</span><input id="p-dia" type="date" value="${esc(p.proximo_dia || "")}"></label>
      </div>
      <label class="campo"><span>Observação</span><textarea id="p-obs" rows="2" maxlength="600">${esc(p.obs || "")}</textarea></label>
      <p class="erro" id="f-erro" role="alert"></p>
      <div class="f-acoes"><button class="bt cheio" id="f-salvar" type="submit">Salvar</button></div></form>`;
    $("#f-x", dlg).onclick = () => dlg.close();
    $("#ficha", dlg).onsubmit = async (evt) => {
      evt.preventDefault();
      const v = { id: p.id || null, nome: $("#p-nome", dlg).value, contato: $("#p-contato", dlg).value, etapa: (dlg.querySelector("input[name=etapa]:checked") || {}).value,
        proximo_passo: $("#p-passo", dlg).value, proximo_dia: $("#p-dia", dlg).value, obs: $("#p-obs", dlg).value };
      if (!v.nome.trim()) { $("#f-erro", dlg).textContent = "Escreva o nome da empresa."; return $("#p-nome", dlg).focus(); }
      try { await rpc("agenda_prospect_salvar", { p_prospect: v }); dlg.close(); toast("Salvo"); await carregar(); }
      catch (er) { $("#f-erro", dlg).textContent = traduz(er.message); }
    };
    dlg.showModal(); if (!p.id) $("#p-nome", dlg).focus();
  }

  // ───────── partida ─────────
  const noLink = (location.hash.match(/k=([^&]+)/) || [])[1];
  // No iPhone, o aplicativo da tela inicial não enxerga o que o Safari guardou: lá a chave fica no endereço,
  // para ir junto quando a página é adicionada à Tela de Início.
  const levaChave = IOS && !(matchMedia("(display-mode: standalone)").matches || navigator.standalone);
  if (levaChave) { const m = document.querySelector("link[rel=manifest]"); if (m) m.href = "manifest-ios.webmanifest"; }
  if (noLink) { st.chave = decodeURIComponent(noLink); if (!levaChave) history.replaceState(null, "", location.pathname + location.search); }
  else { st.chave = guarda.ler("agenda.chave"); if (levaChave && st.chave) history.replaceState(null, "", location.pathname + location.search + "#k=" + encodeURIComponent(st.chave)); }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  if (st.chave) entrar(); else porta();
  // mantém em dia sem ninguém apertar nada
  setInterval(() => { if (st.eu && !dlg.open && !document.hidden) carregar(true); }, 60000);
  document.addEventListener("visibilitychange", () => { if (st.eu && !dlg.open && !document.hidden) carregar(true); });
})();
</script>
</body>
</html>
